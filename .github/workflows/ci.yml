name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The test suite exercises the logistic path only; `tabpfn` (and the
          # ~2 GB torch wheel it pulls in) is needed exclusively for the
          # optional `--model tabpfn` backend, which the suite never imports.
          python -m pip install "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3" "pytest>=7.4"
          python -m pip install -e . --no-deps
      - name: Run tests
        run: pytest -q
